name: CI — binary-failure gates

# CLAWDOG/110 §3 + Standing Rule #12 — every push and PR runs the full
# binary-failure gate suite that defines the architectural contract:
#
#   Pre-pytest:
#     1. tools-manifest drift            (NN#4)
#     2. pre-push hook self-test         (NN#5)
#     3. lint                            (ruff)
#
#   Pytest:
#     4. test_manifest_passthrough       (NN#1, Lesson #38)
#     5. test_advisory_boundary          (NN#2, Lesson #34)
#     6. test_atom_boundary              (NN#3, Lesson #36)
#     7. test_phase3b_e2e                (full meta-tool round-trip)
#     8. test_production_bundle          (Standing Rule #12, Lesson #40)
#
# Lesson #29 anchor: kit deserves the same CI hygiene as the Brain.
# Lesson #39 anchor: Standing Rule #1 enforced via pre-push hook from commit
#                    zero (not a retrofit).

on:
  push:
    branches:
      - "master"
      - "main"
      - "clawdog/**"
  pull_request:
    branches:
      - "master"
      - "main"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + binary-failure gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pre-CI gate #1 — Tools manifest drift (NN#4)
        # The drift check runs BEFORE pytest so any spec drift surfaces with
        # a clear, named failure (rather than as the slowest pytest line).
        run: |
          make tools-manifest-check PY=python

      - name: Pre-CI gate #2 — Pre-push hook self-test (NN#5)
        run: |
          make test-hooks

      - name: Lint (ruff)
        run: |
          ruff check src tests

      - name: Binary-failure gates #1–#5 — pytest
        run: |
          pytest tests/ -v
